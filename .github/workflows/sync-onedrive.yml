name: Sync OneDrive SOH Data

on:
  schedule:
    - cron: '*/2 * * * *'  # Berjalan otomatis tiap 2 menit
  workflow_dispatch:      # Bisa di-run manual dari tab Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OneDrive Sync & Build Static Data
        run: |
          python scripts/sync_onedrive.py

      - name: Commit and Push data.json ONLY
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # HANYA tambahkan file data.json, JANGAN tambahkan index.html
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update SOH data.json" && git push)
